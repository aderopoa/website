name: Deploy to Cloudflare Workers

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'cloudflare-deploy'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ayokunle.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & lint
        run: npm run typecheck && npm run lint

      - name: Build site
        run: npm run build

      # One Worker serves ./dist as static assets and worker/src/index.ts on /api/*.
      # Requires repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
      # Workers KV Storage: Edit, Account Settings: Read) and CLOUDFLARE_ACCOUNT_ID.
      # OPENROUTER_API_KEY is a Worker secret set once via `wrangler secret put`,
      # not a GitHub secret.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
